<style>
/* Layout: barra superior con selector de perfil, navegación lateral, área de trabajo de hasta 1180px */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --sunken: #eef1f4;
  --line: #d9dfe5;
  --ink: #15212e;
  --muted: #5b6876;
  --accent: #0b5f8a;
  --accent-ink: #ffffff;
  --accent-soft: #e2eef5;
  --ok: #1d7a46;   --ok-soft: #e1f2e8;
  --warn: #9a6b00; --warn-soft: #fbf0d2;
  --neg: #b4520c;  --neg-soft: #fbe6d6;
  --bad: #b3261e;  --bad-soft: #f9dedc;
  --none: #5b6876; --none-soft: #e9edf1;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #16202a; --sunken: #1c2833; --line: #2b3946; --ink: #e5ebf0; --muted: #98a6b3;
    --accent: #5fb4e0; --accent-ink: #08131c; --accent-soft: #15344a;
    --ok: #5cc98a; --ok-soft: #133524; --warn: #e2b54a; --warn-soft: #3a2f10; --neg: #f0955a; --neg-soft: #3d2414;
    --bad: #f28b82; --bad-soft: #3f1a18; --none: #98a6b3; --none-soft: #222f3b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #16202a; --sunken: #1c2833; --line: #2b3946; --ink: #e5ebf0; --muted: #98a6b3;
  --accent: #5fb4e0; --accent-ink: #08131c; --accent-soft: #15344a;
  --ok: #5cc98a; --ok-soft: #133524; --warn: #e2b54a; --warn-soft: #3a2f10; --neg: #f0955a; --neg-soft: #3d2414;
  --bad: #f28b82; --bad-soft: #3f1a18; --none: #98a6b3; --none-soft: #222f3b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 14px; }
p { margin: 0; }
.mono, .code { font-family: var(--font-data); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.version-tag { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.news h3 { margin-top: 4px; }
.news ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.news .when { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; background: var(--sunken); margin-right: auto; }
.mode-btn { font: inherit; font-weight: 600; font-size: 13px; border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.mode-btn[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.important-list { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.important .alert p { font-size: 13.5px; }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who select { min-width: 0; width: auto; max-width: 100%; }
.demo-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

.shell { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
nav.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; }
nav.side button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; color: var(--ink); font: inherit; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
nav.side button:hover { background: var(--sunken); }
nav.side button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.side .count { font-size: 11.5px; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-weight: 600; }
nav.side .sep { height: 1px; background: var(--line); margin: 8px 4px; }
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.side button { white-space: nowrap; }
  nav.side .sep { display: none; }
}

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head p { color: var(--muted); max-width: 65ch; margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel > h2 + *, .panel > header + * { margin-top: 12px; }
.panel header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

/* botones */
.btn { font: inherit; font-weight: 600; font-size: 13.5px; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, nav.side button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }

/* formularios */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
input.bad, select.bad { border-color: var(--bad); background: var(--bad-soft); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.section-title { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.section-title .step { font-family: var(--font-data); font-size: 12px; color: var(--accent); }

/* tablas */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--sunken); }
tr.target-row td { background: var(--accent-soft); font-weight: 600; }
td input, td select { padding: 5px 7px; font-size: 13px; }

/* estados y semáforo */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--none-soft); color: var(--none); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.green { background: var(--ok-soft); color: var(--ok); }
.pill.yellow { background: var(--warn-soft); color: var(--warn); }
.pill.orange { background: var(--neg-soft); color: var(--neg); }
.pill.red { background: var(--bad-soft); color: var(--bad); }
.pill.blue { background: var(--accent-soft); color: var(--accent); }
.gap-pos { color: var(--bad); } .gap-neg { color: var(--ok); }

.alert { border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border: 1px solid; }
.alert.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.alert.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.alert.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.alert ul { margin: 0; padding-left: 18px; }
.alert b.t { font-size: 13.5px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .s { font-size: 12px; color: var(--muted); }

.quote-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.quote-card:last-child { border-bottom: 0; }
.quote-card .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.route { font-weight: 600; }
.route .arrow { color: var(--muted); font-weight: 400; padding-inline: 4px; }

.route-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 18px; background: var(--surface); }
.route-card > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
.checklist { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.checklist ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; }
.checklist li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--bad); }
.checklist li.ok::before { background: var(--ok); }
@media (max-width: 980px) { .editor-layout { grid-template-columns: minmax(0, 1fr); } .checklist { position: static; } }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--font-data); font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.origin-box { border: 1px solid var(--warn); border-radius: var(--radius); padding: 14px; background: color-mix(in srgb, var(--warn-soft) 40%, transparent); }
.dropzone { border: 2px dashed var(--line); border-radius: var(--radius); padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--sunken); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.options3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.option { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.option .n { font-family: var(--font-data); color: var(--accent); font-size: 12px; }

.eval-block { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.eval-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; background: var(--sunken); flex-wrap: wrap; }
.eval-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.fig { display: flex; flex-direction: column; gap: 2px; }
.fig .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip svg { width: 100%; height: auto; display: block; }
.verdict { font-weight: 700; font-size: 13px; letter-spacing: .02em; }

.feedback-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 16px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.feedback-item:last-child { border-bottom: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.versions { display: flex; gap: 6px; flex-wrap: wrap; }
.chart svg { width: 100%; height: auto; display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>Tarifador BIDCOM</b><button type="button" class="version-tag" data-nav="novedades" title="Ver novedades">Versión 1.5 · 07/10/2026</button></div>
    <div class="modes" role="group" aria-label="Modo de transporte"><button type="button" class="mode-btn" data-mode-switch="sea">Marítimo</button><button type="button" class="mode-btn" data-mode-switch="air">Aéreo</button></div>
    <div class="who">
      <span class="demo-tag">Prototipo · datos ficticios</span>
      <label class="small muted" for="tema">Tema</label>
      <select id="tema"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select>
      <label class="small muted" for="role">Ver como</label>
      <select id="role"></select>
      <button class="btn small" id="reset" type="button">Reiniciar demo</button>
    </div>
  </div>
</div>
<div class="shell">
  <nav class="side" id="nav" aria-label="Secciones"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept=".xlsx,.xls" hidden>

<script>

/* =====================================================================

function mapPort(raw) {
  const n = norm(raw); if (!n) return { error: 'falta' };
  if (PORT_ALIASES[n]) return { pol: PORT_ALIASES[n] };
  if (n.includes('/')) {
    const parts = n.split('/').map(p => p.trim()).filter(Boolean), codes = [], warns = [], unknown = [];
    for (const p of parts) { if (PORT_ALIASES[p]) { if (!codes.includes(PORT_ALIASES[p])) codes.push(PORT_ALIASES[p]); } else if (NOT_PORTS[p]) warns.push(`"${p}" ${NOT_PORTS[p]}`); else unknown.push(p); }
    if (unknown.length) return { error: `puertos no reconocidos: ${unknown.join(', ')}` };
    return { polGroup: codes, warns };
  }
  if (NOT_PORTS[n]) return { error: `"${raw}" ${NOT_PORTS[n]}` };
  return { error: `"${raw}" no está en el catálogo de puertos (pendiente de mapeo por BIDCOM)` };
}
function mapLine(raw) {
  const n = norm(raw); if (!n) return { error: 'falta Naviera' };
  if (LINE_ALIASES[n]) return { line: LINE_ALIASES[n] };
  const first = n.split(/[\/\-–,]/)[0].trim();
  if (/\+\s*\d+/.test(n)) return { error: `la naviera "${raw}" trae un recargo en el nombre: cargalo como recargo aparte` };
  if (LINE_ALIASES[first]) return { error: `"${raw}" combina varias navieras: cotizá una naviera por fila` };
  return { error: `naviera "${raw}" no reconocida` };
}
function mapContainer(raw) {
  const n = norm(raw).replace(/\s/g, '');
  if (CONTAINER_ALIASES[n]) return { c: CONTAINER_ALIASES[n] };
  if (n.includes('/')) return { error: `tipo de contenedor "${raw}" combina varios tipos: cotizá ${n.split('/').join(' y ')} por separado` };
  return { error: `tipo de contenedor "${raw}" inválido` };
}

  if (fine(f) && fine(l)) return f === 'green' && l === 'green' ? { text: 'Dentro de objetivo', color: 'green' } : { text: 'Negociable', color: 'yellow' };
  if (fine(f) && bad(l)) return { text: 'Negociar locales', color: 'orange' };
  if (bad(f) && fine(l)) return { text: 'Negociar flete', color: 'orange' };
  if (bad(f) && bad(l)) return { text: 'Negociar flete y locales', color: f === 'red' || l === 'red' ? 'red' : 'orange' };
  if (bad(f)) return { text: 'Negociar flete', color: 'orange' };
  return { text: 'Revisar', color: '' };
}
function lastVersion(q) { return q.versions[q.versions.length - 1]; }
// Tipo de tarifa: la primera versión es la inicial; una respuesta a un pedido de BIDCOM es negociada; una corrección mantiene el tipo que corrige
const tipoOf = v => v.tipo || (v.no === 1 ? 'Inicial' : 'Negociada');
const tipoPill = v => pill(tipoOf(v) === 'Negociada' ? 'Tarifa negociada' : 'Tarifa inicial', tipoOf(v) === 'Negociada' ? 'green' : 'blue') + (v.motivo === 'Corrección' ? ' <span class="small muted">corrección</span>' : '');
function initialVersion(q) { return [...q.versions].reverse().find(v => v.locked && tipoOf(v) === 'Inicial') || q.versions[0]; }
const canCorrect = q => !['draft', 'incomplete', 'renegotiation_requested', 'approved', 'rejected', 'expired'].includes(q.status);
function evaluateQuote(q, v = lastVersion(q)) { return v.routes.map(r => ({ r, evals: evaluateRoute(r, q) })); }
function statusAfterEvaluation(q) {
  const v = lastVersion(q);
  if (validateVersion(v).length) return 'incomplete';
  if (tipoOf(v) === 'Negociada') return 'renegotiated';
  const ev = evaluateQuote(q).flatMap(x => x.evals);
  return ev.every(e => e.verdict.color === 'green') ? 'within_target' : 'needs_renegotiation';
}
// Comparación de versiones (R8, R10)
function versionTotals(v) {
  const m = {};
  v.routes.forEach(r => Object.entries(r.freight).forEach(([c, f]) => {
    if (!(Number(f.amt) > 0)) return;
    const k = `${polLabel(r)} → ${portName(r.pod)} · ${c}`;
    const lq = r.locals.filter(l => l.amt !== '' && l.amt != null).reduce((a, l) => a + normLocal(l, c), 0);
    const byCode = {}; r.locals.forEach(l => { if (l.amt !== '' && l.amt != null) byCode[l.code === 'OTHER' ? 'OTHER:' + (l.desc || '') : l.code] = normLocal(l, c); });
    m[k] = { freight: toBase(f.amt, f.cur), locals: lq, total: toBase(f.amt, f.cur) + lq, byCode };
  }));
  return m;
}
function negotiationSummary(q) {
  const v0 = initialVersion(q), v1 = lastVersion(q);
  if (v0 === v1 || tipoOf(v1) !== 'Negociada') return [];
  const a = versionTotals(v0), b = versionTotals(v1), S = state.settings, res = [];
  for (const k of Object.keys(b)) {
    if (!a[k]) continue;
    const f = a[k], l = b[k], fSave = f.freight - l.freight, lSave = f.locals - l.locals, tSave = f.total - l.total;
    const shift = l.freight < f.freight && l.locals > f.locals && tSave < S.shiftRatio * fSave;
    const up = Object.keys(l.byCode).filter(c => (l.byCode[c] || 0) > (f.byCode[c] || 0) + 0.001).map(c => c.startsWith('OTHER:') ? `${c.slice(6)} (nuevo)` : CHARGE_BY[c].name + (f.byCode[c] == null ? ' (nuevo)' : ''));
    res.push({ k, f, l, fSave, lSave, tSave, shift, up });
  }
  return res;
}

function bindEditor() {
  const E = ui.editor;
  const rerender = () => { const y = window.scrollY; render(); window.scrollTo({ top: y }); };
  // Los importes y textos se actualizan sin redibujar, para no perder el foco al pasar de un campo a otro
  const light = (el, ok) => { if (ok !== undefined) el.classList.toggle('bad', !ok); const b = $('#checklist-body'); if (b) b.innerHTML = checklistHTML(validateVersion(E.v)); };
  const val = el => el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
  $('#e-date').oninput = e => { E.v.date = e.target.value; };
  $('#e-vf').oninput = e => { E.v.validFrom = e.target.value; light(e.target, !!e.target.value); };
  $('#e-vt').oninput = e => { E.v.validTo = e.target.value; light(e.target, !!e.target.value); };
  document.querySelectorAll('[data-route]').forEach(card => {
    const r = E.v.routes[+card.dataset.route];
    card.querySelectorAll('[data-k]').forEach(el => {
      if (el.tagName === 'SELECT') el.onchange = () => {
        const k = el.dataset.k; r[k] = el.value;
        if (k === 'pol' && el.value) r.polGroup = null;
        if (k === 'line' && el.value) r.lineRaw = '';
        rerender();
      };
      else el.oninput = () => { const k = el.dataset.k; r[k] = val(el); light(el, k === 'tt' ? Number(el.value) > 0 : undefined); };
    });
    card.querySelectorAll('tr[data-c]').forEach(tr => tr.querySelectorAll('[data-fk]').forEach(el => {
      const f = r.freight[tr.dataset.c], k = el.dataset.fk;
      if (k === 'cur') el.onchange = () => { f.cur = el.value; light(el); };
      else el.oninput = () => { f[k] = val(el); light(el, k === 'amt' ? Number(el.value) > 0 : el.value !== ''); };
    }));
    card.querySelectorAll('[data-l]').forEach(row => row.querySelectorAll('[data-lk]').forEach(el => {
      const l = r.locals[+row.dataset.l], k = el.dataset.lk;
      const h = () => { l[k] = val(el); light(el, k === 'desc' || k === 'just' ? !!el.value.trim() : undefined); };
      if (el.tagName === 'SELECT') el.onchange = h; else el.oninput = h;
    }));
    card.querySelectorAll('[data-act="toggle-c"]').forEach(b => b.onclick = () => {
      const c = b.dataset.c; if (r.freight[c]) delete r.freight[c]; else r.freight[c] = { cur: 'USD', amt: '', free: '' };
      if (r.unmapped && (c === '40ST' || c === '40HQ') && r.freight['40ST'] && r.freight['40HQ']) delete r.unmapped;
      rerender(); });
    card.querySelectorAll('[data-act="del-local"]').forEach(b => b.onclick = () => { r.locals.splice(+b.dataset.j, 1); rerender(); });
    const add = card.querySelector('[data-act-change="add-local"]');
    if (add) add.onchange = () => { const code = add.value; if (!code) return;
      r.locals.push({ id: uid(), code, desc: '', just: '', cur: 'USD', amt: '', unit: code === 'OTHER' ? '' : CHARGE_BY[code].unit }); rerender(); };
  });
  document.querySelectorAll('[data-act="del-route"]').forEach(b => b.onclick = () => { E.v.routes.splice(+b.dataset.i, 1); rerender(); });
}

}

async function handleFile(file) {
  if (typeof XLSX === 'undefined') { ui.importResult = { fatal: 'No se pudo cargar el lector de Excel. Recargá la página.', fileName: file.name }; render(); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    ui.importResult = { ...(ui.mode === 'air' ? readAirWorkbook(wb) : readWorkbook(wb)), fileName: file.name, mode: ui.mode };
  } catch (e) { ui.importResult = { fatal: 'El archivo no es un Excel válido (.xlsx).', fileName: file.name }; }
  render();
}
async function downloadFile(mode, example) {
  if (typeof XLSX === 'undefined') { toast('No se pudo generar el archivo'); return; }
  let data;
  try { data = typeof ExcelJS !== 'undefined' ? new Uint8Array(await buildStyledTemplate(mode, example)) : null; } catch (e) { data = null; }
  if (!data) data = new Uint8Array(mode === 'air' ? buildAirTemplate(example) : buildTemplate(example));   // sin formato, si no cargó la librería
  const name = mode === 'air' ? `BIDCOM_Tarifario_Aereo_${state.airRequest.week.slice(3)}_${example ? 'EJEMPLO' : 'MODELO'}.xlsx` : `BIDCOM_Cotizacion_Maritima_${example ? 'EJEMPLO' : 'MODELO'}.xlsx`;
  try {
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (!dl) {   // fuera de Claude (por ejemplo GitHub Pages): descarga directa del navegador
      const url = URL.createObjectURL(new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(example ? 'Ejemplo descargado' : 'Modelo descargado'); return;
    }
    await dl.save({ filename: name, data });
    toast(example ? 'Ejemplo descargado' : 'Modelo descargado');
  } catch (e) { if (e?.code !== 'declined') toast('No se pudo descargar el archivo'); }
}

function latestOffers() {
  const out = [];

    const v = lastVersion(q);
    evaluateQuote(q, v).forEach(({ r, evals }) => evals.forEach(e => out.push({ q, v, r, e })));

  return out;
}

const AIR_HIST_BASE = { MIA: { r: 2.9, min: 150 }, HKG: { r: 9.4, min: 220 }, PVG: { r: 9.0, min: 210 }, SZX: { r: 9.6, min: 220 }, NGB: { r: 9.3, min: 220 }, CAN: { r: 9.5, min: 220 } };

function buildAirHistory() {
  const rnd = mulberry32(41), rows = [], agents = ['GREEN','AGB','AGD','KN','OTRO'];
  for (let k = 52; k >= 1; k--) {

    const season = 1 + 0.10 * Math.sin((m - 8) / 12 * 2 * Math.PI) + (k < 10 ? 0.04 : 0);

      const rates = { 45: r500 * 1.18, 100: r500 * 1.06, 300: r500 * 1.03, 500: r500, 1000: r500 * 0.97 };
      const locals = Object.fromEntries(Object.entries(AIR_LOCAL_BASE).map(([c, v]) => [c, Math.round(v * (0.85 + rnd() * 0.3))]));
      rows.push({ origin: o, date: d, week: isoWeek(d), agent: agents[Math.floor(rnd() * agents.length)], min: AIR_HIST_BASE[o].min, rates, fuel: 0.12 + rnd() * 0.06, imo: 0, locals, dest: 330 + Math.round(rnd() * 50) });

  let c0 = 1;
  o.groups.forEach(g => {
    const a = `${xlCol(c0)}3`, b = `${xlCol(c0 + g.span - 1)}3`;
    if (g.span > 1) ws.mergeCells(`${a}:${b}`);
    const cell = ws.getCell(a); cell.value = g.label;
    cell.font = { bold: true, size: 10, color: { argb: 'FF' + XLC.white }, name: 'Arial' };
    cell.fill = xlFill(XLC.groups[g.key][0]); cell.alignment = { horizontal: 'center', vertical: 'middle' };
    c0 += g.span;
  });
  ws.getRow(3).height = 20;
  // Fila 4: encabezados (los nombres son los que lee el importador)
  o.cols.forEach((c, i) => {
    const cell = ws.getCell(4, i + 1);
    cell.value = c.h; if (c.note) cell.note = c.note;
    cell.font = { bold: true, size: 10, color: { argb: 'FF' + XLC.ink }, name: 'Arial' };
    cell.fill = xlFill(XLC.groups[c.g][1]); cell.border = xlBorder();
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
  });
  ws.getRow(4).height = 36;
  // Filas de datos
  for (let r = first; r <= lastRow; r++) {
    const vals = o.rows[r - first] || [];
    o.cols.forEach((c, i) => {
      const cell = ws.getCell(r, i + 1);
      const v = vals[i];
      if (c.formula) cell.value = { formula: c.formula(r) };
      else if (v !== undefined && v !== null && v !== '') cell.value = v;
      cell.fill = xlFill(XLC[c.kind]); cell.border = xlBorder();
      cell.font = { size: 10, name: 'Arial', color: { argb: 'FF' + XLC.ink }, bold: !!c.formula };
      if (c.fmt) cell.numFmt = c.fmt;
      cell.alignment = { vertical: 'middle', horizontal: c.align || (c.fmt ? 'right' : 'left'), wrapText: !!c.wrap };
    });
  }
  // Listas desplegables
  o.cols.forEach((c, i) => {
    if (!c.list) return;
    const ref = `${xlCol(i + 1)}${first}:${xlCol(i + 1)}${lastRow}`;
    ws.dataValidations.add(ref, { type: 'list', allowBlank: true, formulae: [c.list], showErrorMessage: true,
      errorStyle: c.strict === false ? 'information' : 'stop', errorTitle: 'Valor fuera de la lista',
      error: c.strict === false ? 'No está en la lista. Si es un concepto adicional, completá la Descripción.' : 'Elegí un valor de la lista desplegable.' });
  });
  o.cols.forEach((c, i) => {
    if (c.kindValid === 'date') ws.dataValidations.add(`${xlCol(i + 1)}${first}:${xlCol(i + 1)}${lastRow}`,
      { type: 'date', operator: 'greaterThan', allowBlank: true, formulae: [new Date(2020, 0, 1)], showErrorMessage: true, errorTitle: 'Fecha inválida', error: 'Escribí la fecha como dd/mm/aaaa.' });
    if (c.kindValid === 'number') ws.dataValidations.add(`${xlCol(i + 1)}${first}:${xlCol(i + 1)}${lastRow}`,
      { type: 'decimal', operator: 'greaterThanOrEqual', allowBlank: true, formulae: [0], showErrorMessage: true, errorTitle: 'Número inválido', error: 'Escribí solo el número, sin USD ni otros textos.' });
  });
  // Semáforo de la columna Control
  const ci = o.cols.findIndex(c => c.formula);
  if (ci >= 0) {
    const ref = `${xlCol(ci + 1)}${first}:${xlCol(ci + 1)}${lastRow}`;
    const st = (bg, fg) => ({ fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FF' + bg } }, font: { color: { argb: 'FF' + fg }, bold: true } });
    const cell0 = `${xlCol(ci + 1)}${first}`;
    const rule = (text, prio, bg, fg) => ({ type: 'expression', priority: prio, formulae: [`ISNUMBER(SEARCH("${text}",${cell0}))`], style: st(bg, fg) });
    ws.addConditionalFormatting({ ref, rules: [rule('Falta', 1, 'FFC7CE', '9C0006'), rule('Revisar', 2, 'FFEB9C', '9C5700'), rule('Completa', 3, 'C6EFCE', '006100'),
      rule('A pedido', 4, 'DDEBF7', '1F4E79'), rule('Sin cotizar', 5, 'EDEDED', '595959')].map(r => ({ ...r, stopIfTrue: true })) });
  }
  return ws;
}
function xlListsSheet(wb, lists) {
  const ws = wb.addWorksheet('Listas', { properties: { tabColor: { argb: 'FFA6A6A6' } }, views: [{ state: 'frozen', ySplit: 1 }] });
  lists.forEach((l, i) => {
    ws.getColumn(i + 1).width = Math.max(14, l.title.length + 4, ...l.values.map(v => String(v).length + 2));
    const h = ws.getCell(1, i + 1); h.value = l.title; h.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 10 }; h.fill = xlFill('595959');
    l.values.forEach((v, j) => { const c = ws.getCell(j + 2, i + 1); c.value = v; c.font = { name: 'Arial', size: 10 }; });
  });
  return lists.map((l, i) => `Listas!$${xlCol(i + 1)}$2:$${xlCol(i + 1)}$${l.values.length + 1}`);
}
function xlInstructions(wb, o) {
  const ws = wb.addWorksheet('Instrucciones', { properties: { tabColor: { argb: 'FF' + XLC.title } }, views: [{ showGridLines: false }],
    pageSetup: { orientation: 'portrait', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  ws.columns = [{ width: 4 }, { width: 118 }];
  let r = 1;
  const line = (text, style = {}) => {
    ws.mergeCells(`A${r}:B${r}`); const c = ws.getCell(`A${r}`); c.value = text;
    c.font = { name: 'Arial', size: style.size || 10, bold: !!style.bold, color: { argb: 'FF' + (style.ink || XLC.ink) } };
    if (style.fill) c.fill = xlFill(style.fill);
    c.alignment = { vertical: 'middle', wrapText: true, indent: 1 };
    ws.getRow(r).height = style.h || 18; r++;
  };
  const item = (mark, text, style = {}) => {
    const a = ws.getCell(`A${r}`), b = ws.getCell(`B${r}`);
    a.value = mark; b.value = text;
    [a, b].forEach(c => { c.font = { name: 'Arial', size: 10, bold: !!style.bold, color: { argb: 'FF' + (style.ink || XLC.ink) } }; c.alignment = { vertical: 'top', wrapText: true }; if (style.fill) c.fill = xlFill(style.fill); });
    a.alignment = { vertical: 'top', horizontal: 'center' };
    ws.getRow(r).height = Math.max(18, Math.ceil(String(text).length / 110) * 15 + 4); r++;
  };
  line(o.title, { size: 15, bold: true, ink: XLC.white, fill: XLC.title, h: 30 });
  if (o.subtitle) line(o.subtitle, { fill: 'DAE3F3', h: 20 });
  r++;
  line('LO IMPORTANTE', { bold: true, size: 11, ink: XLC.title });
  item('!', 'Gastos en origen. ' + o.notes[0], { bold: true, fill: 'FCE4B6', ink: '6B4500' });
  o.notes.slice(1).forEach(t => item('•', t));
  r++;
  line('CÓMO COMPLETAR', { bold: true, size: 11, ink: XLC.title });
  o.steps.forEach((t, i) => item(String(i + 1), t));
  r++;
  line('QUÉ SIGNIFICA CADA COLOR', { bold: true, size: 11, ink: XLC.title });
  [[XLC.req, 'Amarillo: dato obligatorio.'], [XLC.opt, 'Celeste: dato opcional o que depende del caso (por ejemplo, el puerto de transbordo).'],
   [XLC.auto, 'Gris: se calcula solo. No escribir.'], ['C6EFCE', 'Columna Control en verde: la fila está completa.'], ['FFC7CE', 'Columna Control en rojo: dice qué dato falta en esa fila.']]
    .forEach(([fill, t]) => { const a = ws.getCell(`A${r}`); a.fill = xlFill(fill); a.border = xlBorder(); const b = ws.getCell(`B${r}`); b.value = t; b.font = { name: 'Arial', size: 10 }; b.alignment = { indent: 1 }; ws.getRow(r).height = 18; r++; });
  r++;
  line('AL TERMINAR', { bold: true, size: 11, ink: XLC.title });
  item('✓', o.finish);
}
const xlTxt = s => `"${s}"`;
const xlIfBlank = (cell, msg) => `IF(${cell}="",${xlTxt(msg)},"")`;
const xlControl = (startCond, parts) => `IF(${startCond},"",IF((${parts})="","Completa",${parts}))`;

async function buildStyledTemplate(mode, example) {
  const wb = new ExcelJS.Workbook();
  wb.creator = 'BIDCOM'; wb.created = new Date();
  if (mode === 'air') buildAirStyled(wb, example); else buildSeaStyled(wb, example);
  // Orden de solapas: Instrucciones, datos, Listas al final
  const names = wb.worksheets.map(w => w.name);
  ['Instrucciones', ...names.filter(n => n !== 'Instrucciones' && n !== 'Listas'), 'Listas'].forEach((n, i) => { wb.getWorksheet(n).orderNo = i; });
  return wb.xlsx.writeBuffer();
}

// Negociación aérea: tarifa inicial contra la última negociada, ruta por ruta (all-in al peso de referencia)
function airNegotiation(q) {
  const a = initialVersion(q), b = lastVersion(q), W = state.settings.airRefWeight;

  return b.routes.map(r => {
    const ra = a.routes.find(x => x.origin === r.origin);
    if (!ra || validateAirRoute(ra, a.origin[ra.origin], 0).length || validateAirRoute(r, b.origin[r.origin], 0).length) return null;
    const ia = airAllIn(ra, a.origin[ra.origin], W), ib = airAllIn(r, b.origin[r.origin], W);
    return { q, origin: r.origin, ini: ia, fin: ib, save: ia.perKg - ib.perKg, pct: (ia.perKg - ib.perKg) / ia.perKg * 100, origSave: ia.origin - ib.origin, rondas: b.no - a.no };
  }).filter(Boolean);
}

function airEvaluate(r, v) {

  const nav = e.target.closest('[data-nav]'); if (nav && nav.dataset.nav === 'nueva') { openEditor(null); return; }
  if (nav) { go(nav.dataset.nav, { importResult: nav.dataset.nav === 'importar' ? ui.importResult : ui.importResult }); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, q = id ? state.quotes.find(x => x.id === id) : null;
  switch (act) {
    case 'agent-view': go('ver', { agentDetailId: id }); break;
    case 'edit': openEditor(id, 'edit'); break;
    case 'respond': openEditor(id, 'respond'); break;
    case 'correct': openEditor(id, 'correct'); break;
    case 'a-correct': openAirEditor(id, 'correct'); break;
    case 'new-form': openEditor(null); break;
    case 'add-route': ui.editor.v.routes.push(emptyRoute()); render(); break;
    case 'submit': commitEditor(true); break;
    case 'save-draft': commitEditor(false); break;
    case 'dl-model': downloadFile(a.dataset.mode, false); break;
    case 'dl-example': downloadFile(a.dataset.mode, true); break;
    case 'pick-file': $('#fileInput').click(); break;
    case 'sample-kn': ui.importResult = { ...parseLegacy(KN_LEGACY_ROWS), fileName: 'Ejemplo formato actual (ficticio).xlsx', mode: 'sea' }; render(); break;
    case 'import-confirm': doImport(false); break;
    case 'import-draft': doImport(true); break;
    case 'import-cancel': ui.importResult = null; render(); break;
    case 'open-detail': go('detalle', { detailId: id, detailVersion: null, composer: null }); break;
    case 'pick-version': ui.detailVersion = +a.dataset.v; render(); break;
    case 'open-composer': ui.composer = { quoteId: id, message: 'Tu propuesta requiere revisión. Solicitamos revisar estos conceptos y enviar una nueva versión.', items: q.mode === 'air' ? airRenegItems(q) : renegItems(q) }; render(); break;
    case 'close-composer': ui.composer = null; render(); break;
    case 'send-reneg': {
      const C = ui.composer, qq = state.quotes.find(x => x.id === C.quoteId);
      C.items.forEach((it, i) => { const v = Number($('#cmp-' + i)?.value); if (v > 0 && v !== it.max) { it.max = v; if (it.maxLabel) it.maxLabel = `USD ${nf2.format(v)}/kg`; } it.include = !!$('#cmp-inc-' + i)?.checked; });
      const chosen = C.items.filter(it => it.include);
      if (!chosen.length) { toast('Tildá al menos un concepto'); break; }
      state.negotiations.push({ id: uid(), quoteId: qq.id, agent: qq.agent, fromVersion: lastVersion(qq).no, status: 'requested', at: todayISO(), message: $('#cmp-msg').value, items: chosen });
      qq.status = 'renegotiation_requested'; log('Solicitó renegociación', qq, lastVersion(qq).no); ui.composer = null; toast('Pedido enviado al agente'); render(); break;
    }
    case 'set-status': q.status = a.dataset.s; log('Cambió estado a ' + STATUS[a.dataset.s], q, lastVersion(q).no); toast('Estado: ' + STATUS[a.dataset.s]); render(); break;
    case 'save-manual': { const k = a.dataset.key, v = Number(document.getElementById('mt-f-' + k)?.value);
      state.manualTargets[k] = { ...(state.manualTargets[k] || {}), freight: v > 0 ? v : undefined }; log('Cargó target manual ' + k, null); toast('Target manual guardado'); render(); break; }
    case 'mesa-c': ui.mesaC = a.dataset.c; render(); break;
    case 'a-new': openAirEditor(null); break;
    case 'a-edit': openAirEditor(id, 'edit'); break;
    case 'a-respond': openAirEditor(id, 'respond'); break;
    case 'a-agent-view': go('a-ver', { agentDetailId: id }); break;
    case 'a-open': go('a-detalle', { detailId: id, composer: null }); break;
    case 'a-tab': ui.airEditor.tab = a.dataset.ap; render(); break;
    case 'a-add-other': ui.airEditor.v.origin[ui.airEditor.tab].push({ code: 'OTHER', desc: '', cur: 'USD', amt: '', unit: 'per_shipment', min: '', onRequest: false }); render(); break;
    case 'a-submit': commitAirEditor(true); break;
    case 'a-save': commitAirEditor(false); break;
    case 'a-sample': if (!window.__airSample) { toast('Subí el archivo para probar'); break; } ui.importResult = { ...readAirWorkbook(window.__airSample), fileName: 'Tarifario aéreo formato actual (ficticio).xlsx', mode: 'air' }; render(); break;
    case 'a-import-confirm': doAirImport(false); break;
    case 'a-import-draft': doAirImport(true); break;
    case 'note-add': state.settings.notes[a.dataset.mode].push('Nueva indicación'); render(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tema') { applyTheme(t.value); try { localStorage.setItem('bidcom-tema', t.value); } catch (e) {} return; }
  if (t.id === 'role') { ui.role = t.value; ui.editor = null; ui.airEditor = null; ui.composer = null; ui.importResult = null; go(homeView()); return; }
  if (t.dataset?.note) { const [m, i] = t.dataset.note.split(':'); const v = t.value.trim(); if (v) state.settings.notes[m][+i] = v; else state.settings.notes[m].splice(+i, 1); log('Editó indicaciones para agentes (' + (m === 'air' ? 'aéreo' : 'marítimo') + ')'); render(); return; }
  if (t.id === 'req-week' || t.id === 'req-from' || t.id === 'req-to' || t.id === 'req-deadline') { state.airRequest[t.id.slice(4)] = t.value; render(); return; }
  if (t.dataset?.reqRoute) { state.airRequest.routes[+t.dataset.reqRoute].on = t.checked; render(); return; }
  if (t.id === 'h-pol') { ui.histPol = t.value; render(); return; }
  if (t.id === 'h-c') { ui.histC = t.value; render(); return; }
  if (t.id === 'fileInput' && t.files[0]) { handleFile(t.files[0]); t.value = ''; return; }
  const S = state.settings, n = Number(t.value);
  const map = { 's-fr': () => S.freightReduction = n, 's-lr': () => S.localReduction = n, 's-min': () => S.minObs = Math.max(1, Math.round(n)), 's-win': () => S.windowMonths = Math.max(1, Math.round(n)),
    's-y': () => S.yellowMax = n, 's-o': () => S.orangeMax = n, 's-shift': () => S.shiftRatio = n, 'w-cost': () => S.weights.cost = n, 'w-tt': () => S.weights.tt = n,
    's-ar': () => S.airReduction = n, 's-aw': () => S.airRefWeight = Math.max(1, n), 'w-free': () => S.weights.free = n, 'w-direct': () => S.weights.direct = n, 'w-comp': () => S.weights.compliance = n };
  if (map[t.id] && !isNaN(n)) { map[t.id](); log('Cambió configuración: ' + t.id + ' = ' + n); render(); return; }
  if (t.id.startsWith('cbm-') && !isNaN(n)) { S.scenario.cbm[t.id.slice(4)] = n; render(); }
});
document.addEventListener('dragover', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest?.('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) handleFile(f); } });
function homeView() { return ui.mode === 'air' ? (ui.role === 'BIDCOM' ? 'a-comp' : 'a-mis') : (ui.role === 'BIDCOM' ? 'dash' : 'mis'); }
$('#reset').onclick = () => { state = seedState(); Object.assign(ui, { editor: null, airEditor: null, composer: null, importResult: null }); go(homeView()); toast('Demo reiniciada'); };

function applyTheme(v) { if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); }
(function () { let v = 'auto'; try { v = localStorage.getItem('bidcom-tema') || 'auto'; } catch (e) {} applyTheme(v); $('#tema').value = v; })();
load();
loadAirSample();
render();
</script>
