<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Panel de tarifas</title>
<style>
  :root { --bg:#f4f6f8; --surface:#fff; --sunken:#eef1f4; --ink:#15212e; --muted:#5b6876; --line:#d9dee4; --accent:#0B5F8A; --brand:#0000FF;
    --ok:#1e7a3c; --ok-soft:#e2f2e7; --warn:#8a5a00; --warn-soft:#fbf0d2; --bad:#b3261e; --bad-soft:#f9e0de; --s1:#0B5F8A; --s2:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 Arial, Helvetica, sans-serif; }
  header { background:var(--brand); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header img { height:22px; display:block; }
  header .t { font-weight:600; font-size:15px; }
  header .sep { width:1px; height:20px; background:rgba(255,255,255,.45); }
  header .grow { flex:1; }
  header .act { color:rgba(255,255,255,.85); font-size:12px; }
  .filtros { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:42px; z-index:4; }
  .seg { display:inline-flex; background:var(--sunken); border-radius:8px; padding:3px; }
  .seg button { border:0; background:transparent; padding:6px 14px; border-radius:6px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.12); }
  label.f { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12px; }
  select, button.btn { font:inherit; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; padding:5px 8px; }
  button.btn { cursor:pointer; font-weight:600; }
  button.btn:hover { border-color:var(--accent); color:var(--accent); }
  main { padding:14px 16px 24px; display:flex; flex-direction:column; gap:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .kpi .l { color:var(--muted); font-size:12px; }
  .kpi .v { font-size:22px; font-weight:700; margin:2px 0; font-variant-numeric:tabular-nums; }
  .kpi .s { color:var(--muted); font-size:11.5px; }
  .kpi.alerta { border-color:#e2b54a; background:#fffaf0; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; min-width:0; }
  .panel h2 { font-size:14px; margin:0 0 2px; }
  .panel .sub { color:var(--muted); font-size:12px; margin:0 0 10px; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; }
  @media (max-width: 1000px) { .grid2 { grid-template-columns:1fr; } }
  .tw { overflow:auto; max-height:380px; border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { background:var(--sunken); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; cursor:pointer; user-select:none; }
  th.n, td.n { text-align:right; }
  tr:last-child td { border-bottom:0; }
  td .m { color:var(--muted); font-size:11.5px; }
  .chip { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11.5px; font-weight:600; }
  .chip.ok { background:var(--ok-soft); color:var(--ok); } .chip.warn { background:var(--warn-soft); color:var(--warn); } .chip.bad { background:var(--bad-soft); color:var(--bad); }
  .chip.neu { background:var(--sunken); color:var(--muted); }
  .vacio { color:var(--muted); padding:16px; text-align:center; }
  .err { background:var(--bad-soft); color:var(--bad); border-radius:6px; padding:8px 10px; }
  .cargando { padding:60px; text-align:center; color:var(--muted); font-size:14px; }
  .leyenda { display:flex; gap:14px; color:var(--muted); font-size:12px; margin:6px 0 0; }
  .leyenda i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; border-radius:2px; }
  svg text { font:11px Arial, sans-serif; fill:var(--muted); }
  .bar { height:8px; background:var(--sunken); border-radius:4px; overflow:hidden; min-width:60px; }
  .bar span { display:block; height:100%; background:var(--accent); }
</style>
</head>
<body>
<header>
  <img src="https://static.bidcom.com.ar/images/vector/bidcom-logo.svg" alt="BIDCOM" width="132" height="30">
  <span class="sep" aria-hidden="true"></span><span class="t">Panel de tarifas</span>
  <span class="grow"></span><span class="act" id="act"></span>
  <button class="btn" type="button" id="recargar">Actualizar</button>
</header>
<div class="filtros">
  <div class="seg" role="group" aria-label="Transporte"><button type="button" data-modo="mar" aria-pressed="true">Marítimo</button><button type="button" data-modo="air" aria-pressed="false">Aéreo</button></div>
  <label class="f">Período <select id="periodo"><option value="vig">Vigentes hoy</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="365">Últimos 12 meses</option></select></label>
  <label class="f">Ruta <select id="ruta"><option value="">Todas</option></select></label>
  <label class="f" id="fCtnr">Contenedor <select id="ctnr"><option value="">Todos</option><option>20ST</option><option>40ST/40HQ</option><option>40NOR</option></select></label>
  <label class="f">Agente <select id="agente"><option value="">Todos</option></select></label>
</div>
<main id="main"><div class="cargando">Leyendo la base madre…</div></main>

<script>
var D = null, S = { modo: 'mar', periodo: 'vig', ruta: '', ctnr: '', agente: '' }, ORD = {};
var DIA = 86400000;
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dia(s) { if (!s) return NaN; var p = String(s).split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]).getTime() : NaN; }
function fCorta(s) { var p = String(s || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : '—'; }
function usd(v) { if (v === '' || v == null || isNaN(v)) return '—'; return S.modo === 'mar' ? 'USD ' + Math.round(v).toLocaleString('es-AR') : 'USD ' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pct(v, signo) { if (v === '' || v == null || isNaN(v)) return '—'; return (signo && v > 0 ? '+' : '') + (v * 100).toLocaleString('es-AR', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + '%'; }
function med(xs) { xs = xs.filter(function (x) { return x > 0; }).sort(function (a, b) { return a - b; }); if (!xs.length) return NaN; var m = Math.floor(xs.length / 2); return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2; }
function prom(xs) { xs = xs.filter(function (x) { return !isNaN(x); }); return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : NaN; }
function chipHist(v) { if (isNaN(v)) return '<span class="chip neu">Sin histórico</span>'; var c = v <= -0.03 ? 'ok' : v <= 0.05 ? 'warn' : 'bad'; return '<span class="chip ' + c + '">' + pct(v, true) + '</span>'; }
function unidad() { return S.modo === 'mar' ? 'USD por contenedor (flete + Recarga IMO)' : 'USD por kg all-in'; }

// Registro: [tipo, agente, origen, destino, carrier, ctnr, desde, hasta, precio, extra, fila]
function registros() {
  return (D[S.modo] || []).map(function (r) { return { tipo: r[0], agente: r[1], origen: r[2], destino: r[3], carrier: r[4], ctnr: r[5], desde: dia(r[6]), hasta: dia(r[7]), dDesde: r[6], dHasta: r[7], precio: r[8], extra: r[9], fila: r[10] }; });
}
function rutaDe(r) { return r.origen + ' → ' + r.destino; }
function grupoDe(r) { return rutaDe(r) + (S.modo === 'mar' ? ' · ' + r.ctnr : ''); }
function hoyMs() { return dia(D.hoy); }
function enPeriodo(r) {
  var h = hoyMs();
  if (S.periodo === 'vig') return r.desde <= h && (isNaN(r.hasta) || r.hasta >= h);
  return r.desde >= h - Number(S.periodo) * DIA && r.desde <= h + 60 * DIA;
}
function inicioPeriodo(lista) { if (S.periodo !== 'vig') return hoyMs() - Number(S.periodo) * DIA; var m = Math.min.apply(null, lista.map(function (r) { return r.desde; })); return isFinite(m) ? m : hoyMs(); }
function pasaFiltros(r, sinAgente) {
  if (S.ruta && rutaDe(r) !== S.ruta) return false;
  if (S.modo === 'mar' && S.ctnr && r.ctnr !== S.ctnr) return false;
  if (!sinAgente && S.agente && r.agente !== S.agente) return false;
  return true;
}

function calcular() {
  var todos = registros(), base = todos.filter(function (r) { return pasaFiltros(r, true); });
  var per = base.filter(enPeriodo);
  // Por grupo (ruta + contenedor): la mejor oferta de cada agente en el período
  var grupos = {};
  per.forEach(function (r) {
    var g = grupos[grupoDe(r)] = grupos[grupoDe(r)] || { clave: grupoDe(r), ruta: rutaDe(r), ctnr: r.ctnr, ag: {}, ofertas: 0, desdeMin: Infinity };
    g.ofertas++; g.desdeMin = Math.min(g.desdeMin, r.desde);
    var a = g.ag[r.agente];
    if (!a || r.precio < a.precio) g.ag[r.agente] = r;
  });
  var filasMejor = Object.keys(grupos).map(function (k) {
    var g = grupos[k], lista = Object.keys(g.ag).map(function (a) { return g.ag[a]; }).sort(function (a, b) { return a.precio - b.precio; });
    var desde0 = g.desdeMin, hist = med(base.filter(function (r) { return grupoDe(r) === k && r.desde < desde0 && r.desde >= desde0 - 180 * DIA; }).map(function (r) { return r.precio; }));
    var mejor = lista[0], seg = lista[1];
    return { clave: k, ruta: g.ruta, ctnr: g.ctnr, mejor: mejor, seg: seg, dif: seg ? seg.precio / mejor.precio - 1 : NaN, agentes: lista.length, ofertas: g.ofertas, hist: hist,
      vsHist: hist > 0 ? mejor.precio / hist - 1 : NaN, lista: lista };
  });
  // Ranking de agentes (sobre los grupos del período)
  var rk = {};
  filasMejor.forEach(function (f) {
    f.lista.forEach(function (r, i) {
      var a = rk[r.agente] = rk[r.agente] || { agente: r.agente, grupos: 0, mejor: 0, vsMejor: [], vsHist: [], rutas: {}, ultima: 0 };
      a.grupos++; if (i === 0) a.mejor++; a.vsMejor.push(r.precio / f.mejor.precio - 1); if (f.hist > 0) a.vsHist.push(r.precio / f.hist - 1); a.rutas[f.ruta] = 1;
    });
  });
  per.forEach(function (r) { if (rk[r.agente]) { rk[r.agente].ultima = Math.max(rk[r.agente].ultima, r.desde); rk[r.agente].ofertas = (rk[r.agente].ofertas || 0) + 1; } });
  // Negociación: cada negociada contra la inicial del mismo agente, ruta, contenedor y vigencia
  var ini = {}; base.forEach(function (r) { if (r.tipo === 'Inicial') { var k = [r.agente, grupoDe(r), r.dDesde].join('|'); if (!ini[k] || r.precio > ini[k].precio) ini[k] = r; } });
  var negs = [];
  per.forEach(function (r) { if (r.tipo !== 'Negociada') return; var i = ini[[r.agente, grupoDe(r), r.dDesde].join('|')]; if (i && i.precio > 0) negs.push({ agente: r.agente, ahorro: i.precio - r.precio, pct: r.precio / i.precio - 1 }); });
  negs.forEach(function (n) { var a = rk[n.agente]; if (a) { (a.negs = a.negs || []).push(n.pct); } });
  var ranking = Object.keys(rk).map(function (k) { var a = rk[k]; return { agente: a.agente, ofertas: a.ofertas || 0, rutas: Object.keys(a.rutas).length, grupos: a.grupos, mejor: a.mejor,
    vsMejor: prom(a.vsMejor), vsHist: prom(a.vsHist), negs: a.negs || [], ultima: a.ultima }; });
  // Vencen pronto: tarifas vigentes hoy que vencen dentro de los días de aviso
  var h = hoyMs(), lim = h + (Number(D.diasAviso) || 5) * DIA;
  var vencen = base.filter(function (r) { return r.desde <= h && r.hasta >= h && r.hasta <= lim; });
  var agVig = {}; vencen.forEach(function (r) { agVig[r.agente] = 1; });
  var agentesPer = {}; per.forEach(function (r) { agentesPer[r.agente] = 1; });
  var link = D.agentes.slice();
  var faltan = link.filter(function (a) { return !agentesPer[a]; });
  return { per: per, base: base, filasMejor: filasMejor, ranking: ranking, negs: negs, vencen: vencen, agentesPer: Object.keys(agentesPer), faltan: faltan, link: link };
}

function render() {
  if (!D) return;
  $('#fCtnr').style.display = S.modo === 'mar' ? '' : 'none';
  var R = calcular(), pendModo = D.pend.filter(function (p) { return p[3] === S.modo; });
  var mejoresVsHist = R.filasMejor.map(function (f) { return f.vsHist; }).filter(function (x) { return !isNaN(x); });
  var ahorroProm = prom(R.negs.map(function (n) { return n.ahorro; })), ahorroPct = prom(R.negs.map(function (n) { return n.pct; }));
  var h = '';
  if (D.errores.length) h += '<div class="err">' + D.errores.map(esc).join('<br>') + '</div>';
  h += '<section class="kpis" aria-label="Indicadores">' +
    kpi('Para revisar', pendModo.length, pendModo.length ? 'en TARIFADOR Cotizaciones' : 'Nada pendiente', pendModo.length > 0) +
    kpi('Ofertas en el período', R.per.length, R.agentesPer.length + ' agente(s) · ' + R.filasMejor.length + (S.modo === 'mar' ? ' ruta-contenedor' : ' ruta(s)')) +
    kpi('Agentes del link que cotizaron', (R.link.length - R.faltan.length) + ' de ' + R.link.length, R.faltan.length ? 'Faltan: ' + R.faltan.slice(0, 3).join(', ') + (R.faltan.length > 3 ? '…' : '') : 'Cotizaron todos', R.faltan.length > 0) +
    kpi('Mejor tarifa vs histórico', mejoresVsHist.length ? pct(prom(mejoresVsHist), true) : '—', 'Promedio de la mejor oferta de cada ' + (S.modo === 'mar' ? 'ruta-contenedor' : 'ruta') + ' vs su mediana de 6 meses') +
    kpi('Ahorro negociado', R.negs.length ? usd(ahorroProm) : '—', R.negs.length ? (S.modo === 'mar' ? 'por contenedor' : 'por kg') + ', ' + pct(ahorroPct, true) + ' en promedio · ' + R.negs.length + ' tarifa(s) mejorada(s)' : 'Sin negociaciones en el período') +
    kpi('Vencen en ' + (D.diasAviso || 5) + ' días', R.vencen.length, R.vencen.length ? Object.keys(R.vencen.reduce(function (m, r) { m[r.agente] = 1; return m; }, {})).length + ' agente(s)' : 'Ninguna', R.vencen.length > 0) +
    '</section>';
  h += '<section class="panel"><h2>Mejor tarifa por ' + (S.modo === 'mar' ? 'ruta y contenedor' : 'ruta') + '</h2><p class="sub">' + unidad() + '. La mejor oferta de cada agente en el período, comparada con la mediana de los 6 meses anteriores.</p>' + tablaMejor(R) + '</section>';
  h += '<div class="grid2"><section class="panel"><h2>Ranking de agentes</h2><p class="sub">Sobre las ' + (S.modo === 'mar' ? 'rutas-contenedor' : 'rutas') + ' del período. "Vs la mejor" es cuánto está, en promedio, por encima de la oferta más baja.</p>' + tablaRanking(R) + '</section>' +
    '<section class="panel"><h2>Evolución de precios</h2><p class="sub" id="evoSub"></p><label class="f">Ver <select id="evoSel"></select></label><div id="evo"></div></section></div>';
  h += '<section class="panel"><h2>Pendientes de revisar</h2><p class="sub">Elegí la decisión en TARIFADOR Cotizaciones y después usá "Enviar decisiones del team". "Ir a la fila" cierra el panel y te lleva ahí.</p>' + tablaPend(pendModo) + '</section>' +
    '<section class="panel"><h2>Vencen pronto</h2><p class="sub">Tarifas vigentes hoy que vencen en los próximos ' + (D.diasAviso || 5) + ' días.</p>' + tablaVencen(R) + '</section>';
  $('#main').innerHTML = h;
  armarEvolucion(R);
  document.querySelectorAll('[data-ir]').forEach(function (b) { b.onclick = function () { ir(b.getAttribute('data-hoja'), Number(b.getAttribute('data-ir'))); }; });
  document.querySelectorAll('th[data-ord]').forEach(function (th) { th.onclick = function () { var t = th.getAttribute('data-tabla'), c = th.getAttribute('data-ord'); ORD[t] = ORD[t] && ORD[t].c === c ? { c: c, d: -ORD[t].d } : { c: c, d: 1 }; render(); }; });
}
function kpi(l, v, s, alerta) { return '<div class="kpi' + (alerta ? ' alerta' : '') + '"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>'; }
function ordenar(t, filas, porDefecto) {
  var o = ORD[t] || porDefecto; if (!o) return filas;
  return filas.slice().sort(function (a, b) { var x = a[o.c], y = b[o.c]; if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y)) * o.d; x = isNaN(x) ? Infinity : x; y = isNaN(y) ? Infinity : y; return (x - y) * o.d; });
}
function th(t, c, txt, n) { var o = ORD[t], f = o && o.c === c ? (o.d > 0 ? ' ▲' : ' ▼') : ''; return '<th' + (n ? ' class="n"' : '') + ' data-tabla="' + t + '" data-ord="' + c + '" scope="col">' + txt + f + '</th>'; }
function tablaMejor(R) {
  if (!R.filasMejor.length) return '<div class="vacio">No hay ofertas en este período con estos filtros.</div>';
  var filas = ordenar('mej', R.filasMejor.map(function (f) { f._p = f.mejor.precio; f._a = f.mejor.agente; return f; }), { c: 'ruta', d: 1 });
  return '<div class="tw"><table><thead><tr>' + th('mej', 'ruta', 'Ruta') + (S.modo === 'mar' ? th('mej', 'ctnr', 'Ctnr') : '') + th('mej', '_a', 'Mejor oferta') + th('mej', '_p', 'Precio', 1) +
    '<th scope="col">2.º mejor</th>' + th('mej', 'dif', 'Dif. con el 2.º', 1) + th('mej', 'agentes', 'Agentes', 1) + th('mej', 'hist', 'Mediana 6 meses', 1) + th('mej', 'vsHist', 'Vs histórico', 1) + '</tr></thead><tbody>' +
    filas.map(function (f) {
      return '<tr><td>' + esc(f.ruta) + '</td>' + (S.modo === 'mar' ? '<td>' + esc(f.ctnr) + '</td>' : '') + '<td>' + esc(f.mejor.agente) + ' <span class="m">' + esc(f.mejor.carrier) + ' · desde ' + fCorta(f.mejor.dDesde) + '</span></td><td class="n"><b>' + usd(f.mejor.precio) + '</b></td>' +
        '<td>' + (f.seg ? esc(f.seg.agente) + ' <span class="m">' + usd(f.seg.precio) + '</span>' : '<span class="m">Única oferta</span>') + '</td><td class="n">' + pct(f.dif, true) + '</td><td class="n">' + f.agentes + '</td><td class="n">' + usd(f.hist) + '</td><td class="n">' + chipHist(f.vsHist) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function tablaRanking(R) {
  var lista = R.ranking.filter(function (a) { return !S.agente || a.agente === S.agente; });
  if (!lista.length) return '<div class="vacio">Sin datos en el período.</div>';
  lista.forEach(function (a) { a._pm = a.grupos ? a.mejor / a.grupos : 0; a._neg = a.negs.length ? prom(a.negs) : NaN; });
  var max = Math.max.apply(null, lista.map(function (a) { return a._pm; })) || 1;
  return '<div class="tw"><table><thead><tr>' + th('rk', 'agente', 'Agente') + th('rk', 'ofertas', 'Ofertas', 1) + th('rk', 'rutas', 'Rutas', 1) + th('rk', '_pm', 'Veces más barato') + th('rk', 'vsMejor', 'Vs la mejor', 1) +
    th('rk', 'vsHist', 'Vs histórico', 1) + th('rk', '_neg', 'Al negociar', 1) + th('rk', 'ultima', 'Última', 1) + '</tr></thead><tbody>' +
    ordenar('rk', lista, { c: '_pm', d: -1 }).map(function (a) {
      return '<tr><td>' + esc(a.agente) + '</td><td class="n">' + a.ofertas + '</td><td class="n">' + a.rutas + '</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:70px"><span style="width:' + Math.round(a._pm / max * 100) + '%"></span></div>' + a.mejor + ' de ' + a.grupos + '</div></td>' +
        '<td class="n">' + pct(a.vsMejor, true) + '</td><td class="n">' + chipHist(a.vsHist) + '</td><td class="n">' + (a.negs.length ? pct(a._neg, true) + ' <span class="m">(' + a.negs.length + ')</span>' : '<span class="m">—</span>') + '</td><td class="n">' + (a.ultima ? fCorta(new Date(a.ultima).toISOString().slice(0, 10)) : '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function tablaPend(p) {
  if (!p.length) return '<div class="vacio">No hay tarifas esperando decisión.</div>';
  return '<div class="tw"><table><thead><tr><th scope="col">Recibido</th><th scope="col">Agente</th><th scope="col">Ruta</th>' + (S.modo === 'mar' ? '<th scope="col">Ctnr</th>' : '') + '<th class="n" scope="col">Flete</th><th class="n" scope="col">Vs el menor flete</th><th scope="col">Estado</th><th scope="col"></th></tr></thead><tbody>' +
    p.map(function (x) {
      var sem = { Verde: 'ok', Amarillo: 'warn', Naranja: 'warn', Rojo: 'bad' }[x[11]] || 'neu';
      return '<tr><td>' + esc(String(x[2]).slice(5, 16)) + '</td><td>' + esc(x[4]) + '</td><td>' + esc(x[5] + ' → ' + x[6]) + ' <span class="m">' + esc(x[7]) + '</span></td>' + (S.modo === 'mar' ? '<td>' + esc(x[8]) + '</td>' : '') +
        '<td class="n">' + usd(x[9]) + '</td><td class="n">' + pct(x[10], true) + '</td><td><span class="chip ' + sem + '">' + esc(x[12]) + '</span></td><td><button class="btn" type="button" data-hoja="' + esc(D.hojas.cotiz) + '" data-ir="' + x[0] + '">Ir a la fila</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}
function tablaVencen(R) {
  var v = R.vencen.filter(function (r) { return !S.agente || r.agente === S.agente; }).sort(function (a, b) { return a.hasta - b.hasta; });
  if (!v.length) return '<div class="vacio">Ninguna tarifa vence en los próximos días.</div>';
  return '<div class="tw"><table><thead><tr><th scope="col">Vence</th><th scope="col">Agente</th><th scope="col">Ruta</th>' + (S.modo === 'mar' ? '<th scope="col">Ctnr</th>' : '') + '<th class="n" scope="col">Precio</th></tr></thead><tbody>' +
    v.map(function (r) { return '<tr><td>' + fCorta(r.dHasta) + '</td><td>' + esc(r.agente) + '</td><td>' + esc(rutaDe(r)) + '</td>' + (S.modo === 'mar' ? '<td>' + esc(r.ctnr) + '</td>' : '') + '<td class="n">' + usd(r.precio) + '</td></tr>'; }).join('') + '</tbody></table></div>';
}
// Evolución mensual (últimos 12 meses) de un grupo: mejor oferta y mediana del mes
function armarEvolucion(R) {
  var h = hoyMs(), desde = h - 365 * DIA, cuenta = {};
  R.base.forEach(function (r) { if (r.desde >= desde) cuenta[grupoDe(r)] = (cuenta[grupoDe(r)] || 0) + 1; });
  var claves = Object.keys(cuenta).sort(function (a, b) { return cuenta[b] - cuenta[a]; });
  var sel = $('#evoSel');
  if (!claves.length) { sel.parentNode.style.display = 'none'; $('#evo').innerHTML = '<div class="vacio">Sin historial en los últimos 12 meses.</div>'; $('#evoSub').textContent = ''; return; }
  if (!S.evo || claves.indexOf(S.evo) < 0) S.evo = claves[0];
  sel.innerHTML = claves.map(function (k) { return '<option' + (k === S.evo ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('');
  sel.onchange = function () { S.evo = sel.value; armarEvolucion(R); };
  var meses = [], d0 = new Date(h); for (var i = 11; i >= 0; i--) { var m = new Date(d0.getFullYear(), d0.getMonth() - i, 1); meses.push({ k: m.getFullYear() + '-' + ('0' + (m.getMonth() + 1)).slice(-2), t: m.toLocaleDateString('es-AR', { month: 'short' }).replace('.', ''), v: [] }); }
  R.base.forEach(function (r) { if (grupoDe(r) !== S.evo || (S.agente && r.agente !== S.agente)) return; var d = new Date(r.desde), k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); meses.forEach(function (m) { if (m.k === k) m.v.push(r.precio); }); });
  meses.forEach(function (m) { m.min = m.v.length ? Math.min.apply(null, m.v) : NaN; m.med = med(m.v); });
  var vals = meses.reduce(function (a, m) { return a.concat(isNaN(m.min) ? [] : [m.min, m.med]); }, []);
  $('#evoSub').textContent = unidad() + '. Por mes de inicio de vigencia' + (S.agente ? ', solo ' + S.agente : ', todos los agentes') + '.';
  if (!vals.length) { $('#evo').innerHTML = '<div class="vacio">Sin datos para esta selección.</div>'; return; }
  var W = 520, H = 220, L = 58, Rr = 12, T = 12, B = 26, lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { hi = hi * 1.05; lo = lo * 0.95; } var pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  var x = function (i) { return L + i * (W - L - Rr) / 11; }, y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
  var linea = function (campo) { var d = '', abierto = false; meses.forEach(function (m, i) { if (isNaN(m[campo])) { abierto = false; return; } d += (abierto ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(m[campo]).toFixed(1) + ' '; abierto = true; }); return d; };
  var puntos = function (campo, color) { return meses.map(function (m, i) { return isNaN(m[campo]) ? '' : '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(m[campo]).toFixed(1) + '" r="3" fill="' + color + '"><title>' + m.t + ': ' + usd(m[campo]) + ' (' + m.v.length + ' ofertas)</title></circle>'; }).join(''); };
  var g = ''; for (var j = 0; j <= 4; j++) { var v = lo + (hi - lo) * j / 4; g += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="#e3e7ec"/><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + (S.modo === 'mar' ? Math.round(v).toLocaleString('es-AR') : v.toFixed(2)) + '</text>'; }
  var ejes = meses.map(function (m, i) { return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + m.t + '</text>'; }).join('');
  $('#evo').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Evolución mensual de ' + esc(S.evo) + '">' + g + ejes +
    '<path d="' + linea('med') + '" fill="none" stroke="var(--s2)" stroke-width="2"/>' + '<path d="' + linea('min') + '" fill="none" stroke="var(--s1)" stroke-width="2.5"/>' + puntos('med', 'var(--s2)') + puntos('min', 'var(--s1)') + '</svg>' +
    '<div class="leyenda"><span><i style="background:var(--s1)"></i>Mejor oferta del mes</span><span><i style="background:var(--s2)"></i>Mediana del mes</span></div>';
}
function opcionesFiltros() {
  var regs = registros(), rutas = {}, ags = {};
  regs.forEach(function (r) { if (enPeriodo(r) || S.periodo !== 'vig') { rutas[rutaDe(r)] = 1; ags[r.agente] = 1; } });
  regs.forEach(function (r) { rutas[rutaDe(r)] = 1; ags[r.agente] = 1; });
  var llenar = function (sel, vals, actual) { sel.innerHTML = '<option value="">Todas</option>'.replace('Todas', sel.id === 'agente' ? 'Todos' : 'Todas') + Object.keys(vals).sort().map(function (v) { return '<option' + (v === actual ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); };
  if (S.ruta && !rutas[S.ruta]) S.ruta = ''; if (S.agente && !ags[S.agente]) S.agente = '';
  llenar($('#ruta'), rutas, S.ruta); llenar($('#agente'), ags, S.agente);
}
function ir(hoja, fila) { google.script.run.withSuccessHandler(function () { google.script.host.close(); }).tarifadorIrAFila(hoja, fila); }
function cargar() {
  $('#main').innerHTML = '<div class="cargando">Leyendo la base madre…</div>';
  google.script.run.withSuccessHandler(function (d) { D = d; $('#act').textContent = 'Datos al ' + fCorta(d.hoy) + ' · ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }); opcionesFiltros(); render(); })
    .withFailureHandler(function (e) { $('#main').innerHTML = '<div class="err">No pude leer los datos: ' + esc(e && e.message || e) + '</div>'; }).tarifadorDatosPanel();
}
document.querySelectorAll('[data-modo]').forEach(function (b) { b.onclick = function () { S.modo = b.getAttribute('data-modo'); S.ruta = ''; S.agente = ''; S.evo = ''; document.querySelectorAll('[data-modo]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); opcionesFiltros(); render(); }; });
$('#periodo').onchange = function () { S.periodo = this.value; render(); };
$('#ruta').onchange = function () { S.ruta = this.value; S.evo = ''; render(); };
$('#ctnr').onchange = function () { S.ctnr = this.value; S.evo = ''; render(); };
$('#agente').onchange = function () { S.agente = this.value; render(); };
$('#recargar').onclick = cargar;
if (window.google && google.script) cargar(); else if (window.DEMO) { D = window.DEMO; opcionesFiltros(); render(); }
</script>
